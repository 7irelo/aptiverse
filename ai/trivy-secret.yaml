# Trivy secret scanning config for the ai image. Secret scanning stays on for the whole image; this only
# allows the placeholder service-account JSON in the Anthropic SDK's managed-agents docstrings.
allow-rules:
  - id: anthropic-sdk-managed-agents-placeholders
    description: Example credentials in Anthropic SDK beta agent types and docstrings, not real secrets
    path: '.*/site-packages/anthropic/(resources|types)/beta/(agents/(__pycache__/)?agents|agent_create_params|agent_update_params|beta_managed_agents_[a-z_]+)(\.cpython-313\.pyc|\.py)$'
