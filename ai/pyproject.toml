[project]
name = "aptiverse-ai"
version = "0.1.0"
description = "Aptiverse AI service: model gateway, retrieval, LangGraph workflows, MCP and evals"
requires-python = ">=3.13,<3.14"
dependencies = [
  "anthropic[bedrock]",
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2.9",
  "pydantic-settings",
  "httpx",
  "pyjwt[crypto]",
  "structlog",
  "psycopg[binary,pool]",
  "pgvector",
  "alembic",
  "sqlalchemy",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "mcp",
  "sympy",
  "numpy",
  "pyyaml",
  "pymupdf",
  "sse-starlette",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-instrumentation-fastapi",
  "opentelemetry-instrumentation-httpx",
  "opentelemetry-instrumentation-psycopg",
  "boto3",
  "openai>=3.39.0",
]

[project.scripts]
aptiverse-ai = "aptiverse_ai.cli:main"
aptiverse-curriculum-mcp = "aptiverse_ai.mcp_curriculum.server:main"

[project.optional-dependencies]
local-models = ["sentence-transformers"]
tracing = ["langfuse"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "pyright",
  "testcontainers[postgres]",
  "rank-bm25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aptiverse_ai"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "ASYNC109"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "aptiverse_ai.routes.scoped"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"evals/**" = ["S311"]
"src/aptiverse_ai/migrations/**" = ["E501"]

[tool.pyright]
include = ["src", "tests", "evals"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
# LangGraph state is a total=False TypedDict filled in node by node; reads happen after the writing node ran.
reportTypedDictNotRequiredAccess = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "evals/tests"]
markers = [
  "integration: needs Docker (Testcontainers Postgres with pgvector)",
  "live: calls a real model provider; needs an API key and spends money",
]
addopts = "-m 'not live'"
