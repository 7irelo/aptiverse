name: CI / Build AI Service

on:
  push:
    branches: [ main ]
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: false
          tags: ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Upload build artifact
        run: |
          docker save ai-service | gzip > ai-service-image.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-image
          path: ai-service/ai-service-image.tar.gz
          retention-days: 1

      - name: Verify image was built
        run: |
          docker images ai-service
          echo "Docker image built successfully!"
