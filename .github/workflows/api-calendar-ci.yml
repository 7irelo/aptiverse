name: CI / Build Calendar Service

on:
  push:
    branches: [ main ]
    paths:
      - "api/calendar-service/**"
      - ".github/workflows/api-calendar-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "api/calendar-service/**"
      - ".github/workflows/api-calendar-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/calendar-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Docker image
        run: |
          docker build -t calendar-service .
          docker save calendar-service | gzip > calendar-service-image.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calendar-service-image
          path: api/calendar-service/calendar-service-image.tar.gz
          retention-days: 1

      - name: List image info
        run: |
          echo "Docker image built successfully:"
          docker images calendar-service
          echo "Artifact created: calendar-service-image.tar.gz"
