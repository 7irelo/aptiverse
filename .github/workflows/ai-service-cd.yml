name: CD / Deploy AI Service to EC2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to deploy (default: latest)"
        required: false
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            set -e
            echo "Pulling image from Docker Hub..."
            docker pull 7irelo/aptiverse-ai-service:${{ inputs.tag }}

            echo "Stopping existing container..."
            docker stop aptiverse-ai-service 2>/dev/null || true
            docker rm aptiverse-ai-service 2>/dev/null || true

            echo "Starting container..."
            docker run -d \
              --name aptiverse-ai-service \
              --network aptiverse-net \
              -p 8000:8000 \
              -e DATABASE_URL="${{ secrets.AI_DB_URL }}" \
              7irelo/aptiverse-ai-service:${{ inputs.tag }}

            echo "Cleaning up old images..."
            docker image prune -f

            echo "AI Service deployment completed successfully!"
          '
