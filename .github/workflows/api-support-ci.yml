name: CI / Build Support Service

on:
  push:
    branches: [ main ]
    paths:
      - "api/support-service/**"
      - ".github/workflows/api-support-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "api/support-service/**"
      - ".github/workflows/api-support-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/support-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Docker image
        run: |
          docker build -t support-service .
          docker save support-service | gzip > support-service-image.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: support-service-image
          path: api/support-service/support-service-image.tar.gz
          retention-days: 1

      - name: List image info
        run: |
          echo "Docker image built successfully:"
          docker images support-service
          echo "Artifact created: support-service-image.tar.gz"
