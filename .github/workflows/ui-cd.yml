name: CD / Deploy Frontend to EC2

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: |
            7irelo/aptiverse-frontend:latest
            7irelo/aptiverse-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            set -e
            echo "Pulling image from Docker Hub..."
            docker pull 7irelo/aptiverse-frontend:${{ github.sha }}

            echo "Stopping existing container..."
            docker stop aptiverse-frontend 2>/dev/null || true
            docker rm aptiverse-frontend 2>/dev/null || true

            echo "Starting container..."
            docker run -d \
              --name aptiverse-frontend \
              --network aptiverse-net \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e NEXT_PUBLIC_API_URL=https://api.aptiverse.co.za/api \
              -e NEXTAUTH_URL=https://aptiverse.co.za \
              -e NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" \
              7irelo/aptiverse-frontend:${{ github.sha }}

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Frontend deployment completed successfully!"
          '
