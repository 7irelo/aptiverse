name: CD / Deploy Dev Environment

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Services to deploy (comma-separated, or 'all')"
        required: false
        default: "postgres,redis,auth-provider,ui"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy docker-compose and env to EC2
        run: |
          scp -o StrictHostKeyChecking=no \
            infrastructure/docker-compose.dev.yml \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/opt/aptiverse/docker-compose.yml

      - name: Ensure Docker Compose is installed
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            if ! docker compose version &>/dev/null; then
              echo "Installing Docker Compose plugin..."
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-$(uname -m)" \
                -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              docker compose version
            else
              echo "Docker Compose already installed: $(docker compose version)"
            fi
          '

      - name: Deploy services
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            set -e
            cd /opt/aptiverse

            # Create .env if it does not exist
            if [ ! -f .env ]; then
              echo "No .env file found — creating from secrets..."
              cat > .env <<ENVEOF
          POSTGRES_USER=${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_CONNECTION_STRING=Host=postgres;Port=5432;Database=aptiverse;Username=${{ secrets.DB_USERNAME }};Password=${{ secrets.DB_PASSWORD }}
          JWT_KEY=${{ secrets.JWT_KEY }}
          JWT_ISSUER=aptiverse
          JWT_AUDIENCE=aptiverse
          EMAIL_SMTP_HOST=${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT=${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER=${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD=${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS }}
          NEXT_PUBLIC_API_URL=http://${{ secrets.EC2_HOST }}:5000
          NEXTAUTH_URL=http://${{ secrets.EC2_HOST }}:3000
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          ENVEOF
            fi

            echo "Stopping existing services..."
            docker compose down --remove-orphans 2>/dev/null || true
            docker rm -f $(docker ps -aq) 2>/dev/null || true

            echo "Pulling latest images..."
            docker compose pull

            SERVICES="${{ inputs.services }}"
            if [ "$SERVICES" = "all" ]; then
              echo "Starting all services..."
              docker compose up -d
            else
              echo "Starting selected services: $SERVICES"
              docker compose up -d $(echo "$SERVICES" | tr "," " ")
            fi

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Running containers:"
            docker compose ps
          '
