# Deploys the API to the dev EC2 box.
#
# What changed from the previous version, and why it could not have worked:
#   - it copied infrastructure/docker-compose.dev.yml; that path is now
#     infra/, and the dev compose file is postgres + redis for local work, not
#     the production stack. The EC2 stack is infra/compose.prod.yml.
#   - it defaulted to deploying "postgres,redis,auth-provider,ui". auth-provider
#     was folded into the modulith and ui moved to Vercel, so two of those four
#     services no longer exist. Postgres is now RDS, not a container.
#   - it wrote DB_CONNECTION_STRING as Host=postgres, pointing at a container
#     that the prod stack does not define.
#
# The frontend is not deployed here: Vercel builds it from git.
name: CD / Deploy Dev Environment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy compose file to EC2
        run: |
          scp -o StrictHostKeyChecking=no \
            infra/compose.prod.yml \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/opt/aptiverse/docker-compose.yml

      - name: Write environment file
        # Written every run rather than only when absent. The old version
        # skipped this whenever /opt/aptiverse/.env already existed, so a
        # rotated secret or a changed RDS endpoint would never reach the box
        # and the deploy would quietly keep using the stale value.
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            'mkdir -p /opt/aptiverse && cat > /opt/aptiverse/.env && chmod 600 /opt/aptiverse/.env' <<ENVEOF
          DB_CONNECTION_STRING=${{ secrets.DB_CONNECTION_STRING }}
          JWT_KEY=${{ secrets.JWT_KEY }}
          JWT_ISSUER=aptiverse
          JWT_AUDIENCE=aptiverse
          EMAIL_SMTP_HOST=${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT=${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USER=${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD=${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_FROM_ADDRESS=${{ secrets.EMAIL_FROM_ADDRESS }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          ENVEOF

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            set -e
            cd /opt/aptiverse

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose pull
            # No `docker rm -f $(docker ps -aq)` here. That killed every
            # container on the host, including anything unrelated to this
            # stack, to work around ports that `compose up -d` would have
            # rebound anyway. Compose recreates only what changed.
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
          '
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the API is serving
        # A deploy that leaves the container crash-looping should fail loudly
        # here rather than be reported as a success.
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            for i in $(seq 1 30); do
              if curl -fsS http://localhost/health >/dev/null 2>&1; then
                echo "API healthy after ${i}s"
                exit 0
              fi
              sleep 1
            done
            echo "API did not become healthy within 30s. Recent logs:"
            docker compose -f /opt/aptiverse/docker-compose.yml logs --tail=50 api
            exit 1
          '
