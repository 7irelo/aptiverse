name: CD / Deploy Support Service to EC2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to deploy (default: latest)"
        required: false
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            set -e
            echo "Pulling image from Docker Hub..."
            docker pull 7irelo/aptiverse-support-service:${{ inputs.tag }}

            echo "Stopping existing container..."
            docker stop aptiverse-support 2>/dev/null || true
            docker rm aptiverse-support 2>/dev/null || true

            echo "Starting container..."
            docker run -d \
              --name aptiverse-support \
              --network aptiverse-net \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e ASPNETCORE_URLS=http://0.0.0.0:5196 \
              -e Authentication__Google__ClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e Authentication__Google__ClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e Jwt__Key="${{ secrets.JWT_KEY }}" \
              -e Jwt__Issuer="${{ secrets.JWT_ISSUER }}" \
              -e Jwt__Audience="${{ secrets.JWT_AUDIENCE }}" \
              -e ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION_STRING }}" \
              -e ConnectionStrings__Redis="redis-stack:6379,abortConnect=false" \
              7irelo/aptiverse-support-service:${{ inputs.tag }}

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Support Service deployment completed successfully!"
          '
