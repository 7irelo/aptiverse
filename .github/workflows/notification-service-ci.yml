name: CI / Build Notification Service

on:
  push:
    branches: [ main ]
    paths:
      - "notification-service/**"
      - ".github/workflows/notification-service-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "notification-service/**"
      - ".github/workflows/notification-service-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          file: ./notification-service/Dockerfile
          push: false
          tags: notification-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Upload build artifact
        run: |
          docker save notification-service | gzip > notification-service-image.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notification-service-image
          path: notification-service-image.tar.gz
          retention-days: 1

      - name: Verify image was built
        run: |
          docker images notification-service
          echo "Docker image built successfully!"
