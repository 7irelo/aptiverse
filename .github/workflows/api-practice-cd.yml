name: CD / Deploy Practice Service to EC2

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: api/practice-service
          push: true
          tags: |
            7irelo/aptiverse-practice-service:latest
            7irelo/aptiverse-practice-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            set -e
            echo "Pulling image from Docker Hub..."
            docker pull 7irelo/aptiverse-practice-service:${{ github.sha }}

            echo "Stopping existing container..."
            docker stop aptiverse-practice 2>/dev/null || true
            docker rm aptiverse-practice 2>/dev/null || true

            echo "Starting container..."
            docker run -d \
              --name aptiverse-practice \
              --network aptiverse-net \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e ASPNETCORE_URLS=http://0.0.0.0:5196 \
              -e Authentication__Google__ClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e Authentication__Google__ClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e Jwt__Key="${{ secrets.JWT_KEY }}" \
              -e Jwt__Issuer="${{ secrets.JWT_ISSUER }}" \
              -e Jwt__Audience="${{ secrets.JWT_AUDIENCE }}" \
              -e ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION_STRING }}" \
              -e ConnectionStrings__Redis="redis-stack:6379,abortConnect=false" \
              7irelo/aptiverse-practice-service:${{ github.sha }}

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Practice Service deployment completed successfully!"
          '
