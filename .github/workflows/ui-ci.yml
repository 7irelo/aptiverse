name: CI / Build Frontend

on:
  push:
    branches: [ main ]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create Docker image
        run: |
          docker build --no-cache -t aptiverse-frontend .
          docker save aptiverse-frontend | gzip > frontend-image.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: ui/frontend-image.tar.gz
          retention-days: 1
