name: CD / Deploy Payment Gateway to EC2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to deploy (default: latest)"
        required: false
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            set -e
            echo "Pulling image from Docker Hub..."
            docker pull 7irelo/aptiverse-payment-gateway:${{ inputs.tag }}

            echo "Stopping existing container..."
            docker stop aptiverse-payment-gateway 2>/dev/null || true
            docker rm aptiverse-payment-gateway 2>/dev/null || true

            echo "Starting container..."
            docker run -d \
              --name aptiverse-payment-gateway \
              --network aptiverse-net \
              -p 3001:80 \
              -e RAILS_ENV=production \
              -e SECRET_KEY_BASE="${{ secrets.RAILS_SECRET_KEY_BASE }}" \
              -e STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
              -e STRIPE_PUBLISHABLE_KEY="${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
              -e STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
              -e DATABASE_URL="${{ secrets.PAYMENT_DB_URL }}" \
              7irelo/aptiverse-payment-gateway:${{ inputs.tag }}

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Payment Gateway deployment completed successfully!"
          '
