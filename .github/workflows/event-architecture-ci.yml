name: CI / Build & Test Event Architecture

on:
  push:
    branches: [ main ]
    paths:
      - "event-architecture/**"
      - ".github/workflows/event-architecture-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "event-architecture/**"
      - ".github/workflows/event-architecture-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-architecture

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: event-architecture/go.mod
          cache: true

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.30.0"

      - name: Lint protobuf
        run: buf lint

      - name: Generate protobuf code
        run: buf generate

      - name: Go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run tests
        run: go test -race -cover ./...

      - name: Build binary
        run: go build -o bin/event-server ./cmd/server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: event-architecture
          file: event-architecture/deployments/docker/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            7irelo/aptiverse-event-server:latest
            7irelo/aptiverse-event-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
