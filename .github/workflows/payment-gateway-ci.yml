name: CI / Payment Gateway

on:
  push:
    branches: [ main ]
    paths:
      - "payment-gateway/**"
      - ".github/workflows/payment-gateway-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "payment-gateway/**"
      - ".github/workflows/payment-gateway-ci.yml"

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.4"

      - name: Install dependencies
        run: bundle install

      - name: Make bin scripts executable
        run: chmod +x bin/*

      - name: Scan for common Rails security vulnerabilities
        run: |
          bin/brakeman --no-pager --no-exit-on-warn; rc=$?
          if [ $rc -ne 0 ] && [ $rc -ne 5 ]; then exit $rc; fi

  scan_js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.4"

      - name: Install dependencies
        run: bundle install

      - name: Make bin scripts executable
        run: chmod +x bin/*

      - name: Scan JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.4"

      - name: Install dependencies
        run: bundle install

      - name: Make bin scripts executable
        run: chmod +x bin/*

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-gateway

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payment_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config google-chrome-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.4"

      - name: Install dependencies
        run: bundle install

      - name: Make bin scripts executable
        run: chmod +x bin/*

      - name: Prepare database
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/payment_gateway_test
        run: bin/rails db:migrate

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/payment_gateway_test
        run: bin/rails test && bin/rails test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: payment-gateway-screenshots
          path: payment-gateway/tmp/screenshots
          if-no-files-found: ignore

  docker:
    needs: [scan_ruby, scan_js, lint, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: payment-gateway
          push: true
          tags: |
            7irelo/aptiverse-payment-gateway:latest
            7irelo/aptiverse-payment-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
