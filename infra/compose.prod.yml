# Production stack on the free-tier EC2.
#   - api:   pulled from GHCR; listens on :80 (mapped from container :5100)
#   - redis: in-process cache for the API; ephemeral state is fine
#
# Postgres comes from RDS — set DB_CONNECTION_STRING in .env to the
# RDS endpoint terraform outputs.
services:
  redis:
    image: redis:7-alpine
    container_name: aptiverse-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Matches what aptiverse-labs/api's own .github/workflows/deploy.yml
    # publishes on every push to main. Do not repoint this at another
    # namespace without changing that workflow too: the deploy pulls by this
    # exact tag, and a mismatch fails silently (the script has no set -e).
    image: ${API_IMAGE:-ghcr.io/aptiverse-labs/api:latest}
    container_name: aptiverse-api
    restart: unless-stopped
    ports:
      - "80:5100"
    volumes:
      # Student SBA uploads. Without this the storage root resolves to
      # /app/uploads INSIDE the container, so every uploaded piece of
      # coursework was destroyed on each deploy that recreated it. Keep this
      # mount and AssessmentUploads__RootPath below in step; moving to S3 is
      # the longer-term fix the storage abstraction already anticipates.
      - assessment_uploads:/data/aptiverse/uploads
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5100
      AssessmentUploads__RootPath: /data/aptiverse/uploads
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      EmailSettings__Server: ${EMAIL_SMTP_HOST}
      EmailSettings__Port: ${EMAIL_SMTP_PORT}
      EmailSettings__Username: ${EMAIL_SMTP_USER}
      EmailSettings__Password: ${EMAIL_SMTP_PASSWORD}
      EmailSettings__SenderEmail: ${EMAIL_FROM_ADDRESS}
      EmailSettings__SenderName: Aptiverse
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__Apple__ClientId: ${APPLE_CLIENT_ID:-}
      # Paystack. The API is the only thing that reads this; the web app never
      # talks to Paystack directly, so it belongs here and NOT on Vercel.
      # Without this line the container never sees the key even when the host
      # .env has it, and PaystackClient.IsConfigured reads false, so checkout,
      # renewals, refunds and the admin cockpit all silently do nothing.
      #
      # This is a real secret, and a live sk_live key can move money. It lives
      # in the host .env alongside the database password, never in this file
      # and never in git. No default: a blank key must fail loudly as
      # "not configured" rather than look like a working blank configuration.
      Paystack__SecretKey: ${PAYSTACK_SECRET_KEY}
      # Server-side conversion reporting (Meta Conversions API). Without these
      # three the container never sees the values even when they are set on the
      # host, and MetaConversionsClient.IsConfigured reads false, so purchases
      # are simply never reported and nothing says so. All optional: blank is a
      # working configuration, it just means browser-only attribution.
      #
      # META_PIXEL_ID must be the SAME id the web app ships as
      # NEXT_PUBLIC_META_PIXEL_ID, or the server events and the browser events
      # land on two different datasets and neither number is worth reading.
      # META_CAPI_ACCESS_TOKEN is a real secret: it lives in the host .env
      # alongside the database password, never in this file and never in git.
      Meta__PixelId: ${META_PIXEL_ID:-}
      Meta__ConversionsAccessToken: ${META_CAPI_ACCESS_TOKEN:-}
      Meta__TestEventCode: ${META_TEST_EVENT_CODE:-}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  assessment_uploads:
