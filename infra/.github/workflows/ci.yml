name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: 1.15.6
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

      - name: env stacks share one main.tf
        run: |
          cmp envs/dev/main.tf envs/staging/main.tf
          cmp envs/dev/main.tf envs/prod/main.tf
          cmp envs/dev/outputs.tf envs/staging/outputs.tf
          cmp envs/dev/outputs.tf envs/prod/outputs.tf

  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - bootstrap
          - envs/global
          - envs/dev
          - envs/staging
          - envs/prod
          - modules/network
          - modules/database
          - modules/ecr
          - modules/service
          - modules/alb
          - modules/storage
          - modules/secrets
          - modules/ses
          - modules/github-oidc
          - modules/monitoring
          - modules/dns
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false
          terraform validate

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  trivy:
    name: trivy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned image instead of the trivy-action wrapper (fewer moving parts
      # in the supply chain).
      - run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.75.0             config --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore .

  # Plans need the infra-plan role from each env's github_oidc module. Until the
  # repository variables are configured (after the first manual apply), the
  # job is skipped rather than failing.
  plan:
    name: plan (${{ matrix.stack }})
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    needs: [fmt, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        stack: [global, dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: af-south-1
      - name: plan
        id: plan
        working-directory: envs/${{ matrix.stack }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READ }}
        run: |
          terraform init -backend-config=backend.hcl
          set +e
          terraform plan -lock=false -no-color -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          tail -c 60000 plan.txt > plan-trimmed.txt
          exit $code
      - name: comment plan
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          STACK: ${{ matrix.stack }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`envs/${process.env.STACK}/plan-trimmed.txt`, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### terraform plan: ${process.env.STACK}\n\n<details><summary>show plan</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`,
            });

  # Apply on merge to main, one stack at a time. Each job runs in the GitHub
  # environment of the same name; protect "prod" (and "global") with required
  # reviewers so the reviewed PR plan is re-checked before it is applied.
  apply-global:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AWS_APPLY_ROLE_ARN_GLOBAL != ''
    needs: [fmt, validate, tflint, trivy]
    uses: ./.github/workflows/apply.yml
    with:
      stack: global
      environment: global
      role_var: AWS_APPLY_ROLE_ARN_GLOBAL
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  apply-dev:
    # Runs when the previous stack applied or was skipped (not configured yet),
    # but never after a failure.
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AWS_APPLY_ROLE_ARN_DEV != '' }}
    needs: [fmt, validate, tflint, trivy, apply-global]
    uses: ./.github/workflows/apply.yml
    with:
      stack: dev
      environment: dev
      role_var: AWS_APPLY_ROLE_ARN_DEV
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  apply-staging:
    # Runs when the previous stack applied or was skipped (not configured yet),
    # but never after a failure.
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AWS_APPLY_ROLE_ARN_STAGING != '' }}
    needs: [fmt, validate, tflint, trivy, apply-dev]
    uses: ./.github/workflows/apply.yml
    with:
      stack: staging
      environment: staging
      role_var: AWS_APPLY_ROLE_ARN_STAGING
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  apply-prod:
    # Runs when the previous stack applied or was skipped (not configured yet),
    # but never after a failure.
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AWS_APPLY_ROLE_ARN_PROD != '' }}
    needs: [fmt, validate, tflint, trivy, apply-staging]
    uses: ./.github/workflows/apply.yml
    with:
      stack: prod
      environment: prod
      role_var: AWS_APPLY_ROLE_ARN_PROD
    secrets: inherit
    permissions:
      contents: read
      id-token: write
