services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: aptiverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aptiverse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aptiverse-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Consolidated API host (modular monolith: auth + 14 .NET domain modules in
  # a single process). Default — runs without a profile flag.
  #
  # The legacy per-service containers (auth-provider + 14 services) are
  # tagged `profiles: ["legacy"]`. To run them instead of the consolidated
  # host, use:  docker compose --profile legacy up
  # ---------------------------------------------------------------------------
  aptiverse-api:
    build:
      context: ..
      dockerfile: api/Aptiverse.Api/Dockerfile
    image: 7irelo/aptiverse-api:latest
    container_name: aptiverse-api
    restart: unless-stopped
    ports:
      - "5100:5100"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5100
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpPort: ${EMAIL_SMTP_PORT}
      Email__SmtpUser: ${EMAIL_SMTP_USER}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # AI Service (Python/FastAPI)
  # ---------------------------------------------------------------------------
  ai-service:
    image: 7irelo/aptiverse-ai-service:latest
    container_name: aptiverse-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DB_CONNECTION_STRING}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Payment Gateway (Rails)
  # ---------------------------------------------------------------------------
  payment-gateway:
    image: 7irelo/aptiverse-payment-gateway:latest
    container_name: aptiverse-payment-gateway
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/aptiverse
      RAILS_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # UI (Next.js)
  # ---------------------------------------------------------------------------
  ui:
    image: 7irelo/aptiverse-frontend:latest
    container_name: aptiverse-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      - aptiverse-api

volumes:
  postgres_data:
  redis_data:
