  ui:
    image: 7irelo/aptiverse-frontend:latest
    container_name: aptiverse-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      - auth-provider

volumes:
  postgres_data:
  redis_data:
